openai:
  api_key: ${OPENAI_API_KEY}
  model: gpt-4o-realtime-preview
  voice: alloy
  temperature: 0.3

audio:
  input_format: pcm16
  output_format: pcm16
  sample_rate: 24000

vad:
  type: server_vad
  threshold: 0.5
  prefix_padding_ms: 300
  silence_duration_ms: 800

session:
  idle_timeout_seconds: 180
  bootstrap_summary_lookback_minutes: 60
  max_say_duration_seconds: 25

safety:
  require_confirmation_for_side_effect: true
  confirmation_keywords:
    - confirm
    - yes
    - 确认
    - 执行
  cancel_keywords:
    - cancel
    - stop
    - 取消
